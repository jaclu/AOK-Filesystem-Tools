#!/bin/bash
# This is sourced. Fake bang-path to help editors and linters
# shellcheck disable=SC2034

skip_linters+=(
    # markdownlint
)

# Explicit excludes, give entire filepath as listed by olint
excludes+=(
    #CHANGES.md
    #Docs/hostname.md
)

_cmd="codespell -H -S './.git,./.venv,./.mypy_cache' -L aNULL,nulll,BU"
override_linter_cmd["codespell"]="$_cmd"

project_linters+=(
    # Markdown heavy projects
    rumdl             # 150/80 depending on rumdl_change_code
    mdlint            # 145/75 depending on mdlint_change_code
    markdownlint-cli2 # 42
    markdownlint      # 42
    pymarkdown        # 42
)
