#!/bin/bash
# This is sourced. Fake bang-path to help editors and linters
# shellcheck disable=SC2034

skip_linters+=(
    # markdownlint
)

# Explicit excludes, give entire filepath as listed by olint
excludes+=(
    #CHANGES.md
    #Docs/hostname.md
)

override_linter_cmd["codespell"]="codespell -H -S './.git,./.venv,./.mypy_cache' -L aNULL,nulll,BU"
